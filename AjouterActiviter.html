

<div id="modalActivite" class="hidden fixed inset-0 bg-black/50 flex justify-center items-center">

    <form id="formActivite" class="bg-white p-5 rounded-lg w-80">

        <h2 class="font-bold text-lg mb-3">Ajouter une activité</h2>

        <input type="text" id="titre" placeholder="Titre"
            class="border p-2 rounded w-full mb-3">

        <select id="theme" class="border p-2 rounded w-full mb-3">
            <option value="">choisir un thème</option>
            <option value="jeu">jeu</option>
            <option value="apprentissage">apprentissage</option>
            <option value="exercice">Exercice</option>
            <option value="autre">Autre</option>
        </select>

        <textarea id="objectifs" placeholder="Objectifs pédagogiques (facultatif)"
            class="border p-2 rounded w-full mb-3"></textarea>

        <label class="text-sm">Durée (10 à 20 minutes)</label>
        <input type="number" id="duree" min="10" max="20" placeholder="Durée"
            class="border p-2 rounded w-full mb-3">

        <textarea id="description" placeholder="Description de l'activité"
            class="border p-2 rounded w-full mb-3"></textarea>

        <button id="btnAjouter" type="submit" class="bg-blue-600 text-white p-2 rounded w-full">
            Ajouter
        </button>

    </form>
</div>
