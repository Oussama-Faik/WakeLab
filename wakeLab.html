<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WakeLab</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body class="bg-[#F7F7FC]">
    <header class="grid grid-cols-3 gap-3 mt-5 mb-5">
      <button
        id="openformajouteractivity"
        class="flex rounded-xl border-0 px-[15px] py-[14px] text-[13px] font-semibold text-[#d9d6ff] bg-blue-500 text-white justify-center items-center"
      >
        <span class="text-xl">＋</span>
        <span>Ajouter une activité</span>
      </button>
      <div class="ml-5 border border-gray-200 rounded-lg px-2 py-1">
        <span class="text-xl">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher une activité..."
        />
      </div>

      <select
        id="themeFilter"
        aria-label="Filtrer par thème"
        class="border border-gray-200 rounded-lg"
      >
        <option value="all">Tous les thèmes</option>
        <option value="jeu">Jeu</option>
        <option value="apprentissage">Apprentissage</option>
        <option value="exercice">Exercice</option>
        <option value="autre">Autre</option>
      </select>
    </header>
    <!--Cards Container-->
    <div id="cardscontainer" class="grid grid-cols-3 gap-3"></div>
    <!--Bienvenue Formulaire-->
    <div
      id="Bienvenueform"
      class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
    >
      <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Bienvenue sur WakeLab</h1>

        <form id="nameForm">
          <label class="block mb-2"> Le nom complet </label>

          <input
            type="text"
            id="nomcomplete"
            placeholder="Entrer le nom complet"
            required
            class="w-full border p-2 rounded mb-4"
          />

          <button
            id="commencerbouton"
            class="bg-blue-500 text-white px-4 py-2 rounded w-full"
          >
            Commencer
          </button>
        </form>
      </div>
    </div> 

    <!--Ajouter Form-->
<div
  id="activityform"
  class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
>
  <div class="max-w-md w-full bg-white p-6 rounded-xl shadow-lg max-h-[90vh] overflow-y-auto">

    <form name="ajouterform" class="space-y-4">

      <h2 class="text-xl font-bold text-gray-800">
        Ajouter une activité
      </h2>

      <div>
        <label class="block mb-2">Titre</label>
        <input
        name="titre"
          type="text"
          id="titre"
          placeholder="Titre de l'activité"
          class="w-full border p-2 rounded-lg"
        />
        <p id="titreError" class="text-red-500 text-sm"></p>
      </div>

      <div>
        <label class="block mb-2">Thème</label>
        <select id="theme" class="w-full border p-2 rounded-lg " name="theme">
          <option value="">Choisir un thème</option>
          <option value="jeu">Jeu</option>
          <option value="apprentissage">Apprentissage</option>
          <option value="exercice">Exercice</option>
          <option value="autre">Autre</option>
        </select>
        <p id="themeError" class="text-red-500 text-sm"></p>
      </div>

      <div>
        <label class="block mb-2">Objectifs pédagogiques (facultatif)</label>
        <textarea
        name="objectifs"
          id="objectifs"
          placeholder="Les objectifs de l'activité"
          class="w-full border p-2 rounded-lg"
        ></textarea>
      </div>

      <div>
        <label class="block mb-2">Durée (10 à 20 minutes)</label>
        <input
        name="duree"
          type="number"
          id="duree"
          placeholder="Ex: 15"
          class="w-full border p-2 rounded-lg"
        />
        <p id="dureeError" class="text-red-500 text-sm"></p>
      </div>

      <div>
        <label class="block mb-2">Description</label>
        <textarea
        name="description"
          id="description"
          placeholder="Déroulement de l'activité"
          class="w-full border p-2 rounded-lg "
        ></textarea>
        <p id="descriptionError" class="text-red-500 text-sm"></p>
      </div>

      <div class="flex gap-3">
        <button
        id="ajouteractiviter"
          type="submit"
          class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg flex-1"
        >
          Ajouter
        </button>
      </div>

    </form>
  </div>
</div>    <script src="app.js"></script>
  </body>
</html>
